<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- 坐标轴 (浅灰色，用于辅助定位) -->
  <path d="M 10 50 H 90 M 50 10 V 90" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

  <!-- 双曲线 左分支 (纯黑) -->
  <path d="M 15 10 C 42 25, 42 75, 15 90" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- 双曲线 右分支 (纯黑) -->
  <path d="M 85 10 C 58 25, 58 75, 85 90" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
